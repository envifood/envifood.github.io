  <title>Сергей Аралин</title>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: white; text-align: center; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin-top: 20px; border: 3px solid #38bdf8; }
    h1 { margin: 15px 0 5px; font-size: 32px; }
    h2 { margin: 0 0 20px; font-weight: normal; color: #94a3b8; }

    .links a {
      display: inline-block;
      margin: 10px;
      padding: 10px 15px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      background: #1e293b;
      transition: 0.3s;
    }
    .links a:hover { background: #38bdf8; }

    .section { margin-top: 40px; }

    iframe {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border-radius: 12px;
      border: none;
      margin-top: 15px;
    }

    /* Instagram real grid */
    .insta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .insta-item {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .insta-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }

    .insta-item:hover img {
      transform: scale(1.1);
      filter: brightness(0.7);
    }

    .insta-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: 0.3s;
      font-size: 14px;
    }

    .insta-item:hover .insta-overlay {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .insta-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
